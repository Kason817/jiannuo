font-style:normal;color:#b7e5dc}.intro p{font-size:16px;line-height:1.9;color:#c5d7d9;margin-bottom:27px;max-width:420px}.primary{background:var(--cream);color:#173038;border:1px solid #fff5;padding:14px 29px;border-radius:3px;font-weight:700;font-size:18px;letter-spacing:3px;box-shadow:0 6px 30px #060e1755;transition:transform .15s,background .15s}.primary:hover{background:#fff4da;transform:translateY(-2px)}.secondary{padding:12px 18px;color:#c5d9d9;border:1px solid #b4d5ce4d;background:#122b32b0;margin-left:12px;border-radius:3px;font-size:15px}.intro-note{font-size:13px;color:#89a9ad;letter-spacing:1px;margin-top:24px}.brand-corner{position:absolute;right:4%;bottom:9%;font-family:serif;letter-spacing:5px;color:#e1d0a7;font-size:20px}.banner{position:absolute;top:25%;left:50%;transform:translate(-50%,-8px);opacity:0;text-align:center;pointer-events:none;transition:opacity .2s,transform .2s;text-shadow:0 3px 14px #000;background:linear-gradient(90deg,transparent,#0a202ccb 20%,#0a202ccb 80%,transparent);width:64%;padding:15px 28px}.banner.visible{opacity:1;transform:translate(-50%,0)}.banner strong{font-family:serif;font-size:28px;letter-spacing:5px;color:#eee2bc}.banner p{font-size:15px;color:#c2dfdb;margin:9px 0 0;line-height:1.6}.banner.small{top:22%;padding:10px 20px}.banner.small strong{font-size:22px}.modal-wrap{position:absolute;inset:0;display:none;place-items:center;background:#071119b8;backdrop-filter:blur(8px);z-index:10}.modal{width:min(76%,580px);padding:36px 38px;background:linear-gradient(145deg,#1a363de8,#101e26f5);border:1px solid #b5cfb95c;box-shadow:0 30px 90px #0006;text-align:center;border-radius:6px}.modal .emblem{color:var(--gold);font-size:28px;margin-bottom:15px}.modal h2{font-family:serif;font-size:38px;letter-spacing:5px;margin:9px 0 15px}.modal p{font-size:16px;line-height:1.8;color:#bdd2d0}.modal-stats{display:flex;justify-content:center;gap:35px;margin:24px 0}.modal-stats span{display:block;color:#adc9c8;font-size:14px}.modal-stats b{di <main id="stage" aria-label="松岗剑诺横版动作小游戏">

<div class="boss-hud" id="bossHud"><div>混沌 · 紫核守卫</div><div class="boss-track"><span id="bossBar"></span></div><div class="boss-status" id="bossStatus">观察预兆，伺机进攻</div></div>

<section class="intro" id="intro"><div class="intro-copy"><div class="eyebrow">松岗剑诺 · 信义试炼</div><h1>一诺千金<br><em>剑守吴疆</em></h1><p>穿过吴地石桥，寻回三枚诺印。<br>与徐昭并肩，让剑光驱散混沌。</p><button class="primary" id="startBtn" disabled>正在唤醒剑光…</button><button class="secondary" id="introHelp">操作说明</button><div class="intro-note">横版战斗 / 三段连击 / 闪避 / 伙伴支援</div></div><div class="brand-corner">第一关 · 吴地石桥</div></section>

<script>(function(scope){
'use strict';
const W=1280,H=720,GROUND=584,WORLD=4480;
const PLATFORMS=[{x:365,y:479,w:235},{x:1380,y:464,w:265},{x:1870,y:494,w:170},{x:2180,y:469,w:185}];
const SHARDS=[{id:0,x:480,y:429},{id:1,x:1510,y:414},{id:2,x:2640,y:527}];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
class Game{
 constructor(){this.reset();this.mode='title';}
 reset(){
  this.mode='playing';this.time=0;this.score=0;this.kills=0;this.hits=0;this.camera=0;this.shake=0;
  this.player={x:155,y:GROUND,vx:0,vy:0,facing:1,hp:100,maxHp:100,grounded:true,inv:0,atk:0,atkCd:0,dash:0,dashCd:0,supportCd:0,combo:0,comboAt:-10,push:0};
  this.waves=[{id:0,x:690,gate:1220,triggered:false,cleared:false},{id:1,x:1740,gate:2360,triggered:false,cleared:false}];
  this.shards=SHARDS.map(s=>({...s,collected:false}));this.enemies=[];this.bullets=[];this.boss=null;this.bossStarted=false;this.bossDead=false;
  this.events=[];this.swing=0;this.banners=[];this.checkpoint=null;this.supportFx=0;this.finishTime=0;this.tipStage=0;this.makeCheckpoint(155);
 }
 emit(type,data={}){this.events.push({type,...data});}
 drain(){return this.events.splice(0);}
 start(){this.reset();this.emit('banner',{title:'吴地石桥',body:'寻回三枚诺印，让剑光照见前路。'});}
 makeCheckpoint(x){this.checkpoint={x,waves:this.waves.map(w=>w.cleared),shards:this.shards.map(s=>s.collected),score:this.score,kills:this.kills};}
 respawn(){
  const c=this.checkpoint;this.reset();
  this.player.x=c.x;this.waves.forEach((w,i)=>{w.cleared=c.waves[i];w.triggered=c.waves[i];});this.shards.forEach((s,i)=>s.collected=c.shards[i]);
  this.score=c.score;this.kills=c.kills;this.camera=Math.max(0,c.x-380);this.makeCheckpoint(c.x);
  this.emit('banner',{title:'剑心未熄',body:'已回到最近的诺印锚点。'});
 }
 get collected(){return this.shards.filter(s=>s.collected).length;}
 get objective(){
  if(this.bossDead)return '前往右侧光门，完成试炼';
  if(this.bossStarted)return '击破混沌 · 红圈蓄力时跳跃或闪避';
  const active=this.waves.find(w=>w.triggered&&!w.cleared);
  if(active)return '清除碎影，解除前方封印';
  if(this.collected<3)return '寻回诺印 '+this.collected+' / 3 · 高台上的光点可以跳起拾取';
  return '诺印已齐 · 向右进入混沌裂隙';
 }
 attack(){
  const p=this.player;if(p.atkCd>0||p.dash>0||this.mode!=='playing')return false;
  p.combo=this.time-p.comboAt<.95?p.combo%3+1:1;p.comboAt=this.time;p.atk=.27;p.atkCd=p.combo===3?.47:.34;this.swing++;
  const damage=p.combo===3?32:20;
  this.emit('slash',{x:p.x+p.facing*64,y:p.y-69,facing:p.facing,combo:p.combo});this.emit('sound',{name:'slash',pitch:p.combo});
  for(const e of this.enemies){
   if(e.hp>0&&Math.abs(e.x-p.x)<137&&Math.abs(e.y-p.y)<132&&(e.x-p.x)*p.facing>-36)this.hitEnemy(e,damage,p.facing);
  }
  const b=this.boss;
  if(b&&b.hp>0&&Math.abs(b.x-p.x)<197&&Math.abs(b.y-p.y)<170&&(b.x-p.x)*p.facing>-55)this.hitBoss(damage);
  return true;
 }
 dash(){
  const p=this.player;if(p.dashCd>0||this.mode!=='playing')return false;
  p.dash=.20;p.dashCd=1.25;p.inv=Math.max(p.inv,.30);p.atk=0;
  this.emit('dash',{x:p.x,y:p.y,facing:p.facing});this.emit('sound',{name:'dash'});return true;
 }
 support(){
  const p=this.player;if(p.supportCd>0||this.mode!=='playing')return false;
  p.supportCd=12;this.supportFx=1.45;p.hp=Math.min(100,p.hp+20);
  for(const e of this.enemies)if(e.hp>0&&Math.abs(e.x-p.x)<440){this.hitEnemy(e,32,p.facing);e.stun=1;}
  if(this.boss&&this.boss.hp>0&&Math.abs(this.boss.x-p.x)<500){this.hitBoss(38);this.boss.stun=.75;}
  this.bullets=this.bullets.filter(b=>Math.abs(b.x-p.x)>420);
  this.emit('support',{x:p.x,y:p.y});this.emit('text',{x:p.x,y:p.y-155,text:'+20',color:'#a9f3ca'});
  this.emit('banner',{title:'徐昭 · 星图指引',body:'恢复生命，并破除周围的混沌气息。',small:true});this.emit('sound',{name:'support'});return true;
 }
 hitEnemy(e,dmg,dir){
  if(e.hp<=0)return;e.hp-=dmg;e.flash=.16;e.stun=.20;e.x+=dir*22;
  this.shake=Math.max(this.shake,3);this.emit('hit',{x:e.x,y:e.y-45,color:'#b3f0f2'});this.emit('text',{x:e.x,y:e.y-110,text:String(dmg)});
  if(e.hp<=0){e.dead=.65;this.kills++;this.score+=100;this.player.hp=Math.min(100,this.player.hp+5);this.emit('sound',{name:'pop'});}
 }
 hitBoss(dmg){
  const b=this.boss;if(!b||b.hp<=0)return;b.hp=Math.max(0,b.hp-dmg);b.flash=.18;this.shake=Math.max(this.shake,5);
  this.emit('hit',{x:b.x-15,y:b.y-130,color:'#d5b4ff'});this.emit('text',{x:b.x,y:b.y-235,text:String(dmg)});
  this.emit('sound',{name:'hit'});
  if(b.hp<=0){this.bossDead=true;this.bullets=[];b.state='dead';b.timer=1.6;this.score+=1200;this.shake=13;
   this.emit('bossDeath',{x:b.x,y:b.y-110});this.emit('banner',{title:'混沌已散',body:'信义之门已开启，继续向右。'});this.emit('sound',{name:'win'});
  }
 }
 hurt(damage,sourceX){
  const p=this.player;if(p.inv>0||this.mode!=='playing')return false;
  p.hp=Math.max(0,p.hp-damage);p.inv=1.05;p.push=(p.x>=sourceX?1:-1)*220;p.vy=Math.min(p.vy,-190);this.hits++;this.shake=7;
  this.emit('hurt',{x:p.x,y:p.y-70});this.emit('text',{x:p.x,y:p.y-155,text:'−'+damage,color:'#ff9f97'});this.emit('sound',{name:'hurt'});
  if(p.hp<=0){this.mode='dead';this.emit('dead');}return true;
 }
 spawnWave(w){
  w.triggered=true;
  for(let i=0;i<3;i++)this.enemies.push({id:w.id+'-'+i,wave:w.id,x:w.x+215+i*110,y:GROUND,hp:38,maxHp:38,state:'move',timer:.6+i*.15,flash:0,stun:0,dead:0,phase:i});
  this.emit('banner',{title:w.id===0?'碎影来袭':'石桥异动',body:'清除三只混沌碎影，解除路障。',small:true});this.emit('sound',{name:'wave'});
 }
 step(dt,input={}){
  if(this.mode!=='playing')return;dt=Math.min(dt,.04);this.time+=dt;this.shake=Math.max(0,this.shake-dt*25);this.supportFx=Math.max(0,this.supportFx-dt);
  const p=this.player;
  for(const k of ['inv','atk','atkCd','dash','dashCd','supportCd'])p[k]=Math.max(0,p[k]-dt);
  if(input.dash)this.dash();if(input.support)this.support();
  const move=(input.right?1:0)-(input.left?1:0);
  if(move&&p.dash<=0)p.facing=move;
  if(input.jump&&p.grounded){p.vy=-790;p.grounded=false;this.emit('sound',{name:'jump'});}
  p.vx=(p.dash>0?p.facing*830:move*325)+p.push;p.push*=Math.exp(-dt*11);
  const oldY=p.y;p.x+=p.vx*dt;
  p.vy+=2150*dt;p.y+=p.vy*dt;p.grounded=false;
  if(p.y>=GROUND){p.y=GROUND;p.vy=0;p.grounded=true;}
  for(const plat of PLATFORMS){

'use strict';
const {Game,W,H,GROUND,WORLD,PLATFORMS,clamp}=Trial;
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),g=new Game();
const $=id=>document.getElementById(id);
const images={},held=new Set(),edge=new Set(),fx=[],texts=[];
let ready=false,last=0,clock=0,bannerUntil=0,dialogBack='title',muted=false,ac=null;
let best=0;try{best=Number(localStorage.getItem('songgang-trial-best-v1'))||0;}catch{}
const rnd=(a,b)=>a+Math.random()*(b-a);
const fmt=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');
const keymap={KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right',Space:'jump',KeyW:'jump',ArrowUp:'jump',KeyJ:'attack',KeyK:'dash',ShiftLeft:'dash',ShiftRight:'dash',KeyE:'support',KeyL:'support'};
function press(k){if(!held.has(k))edge.add(k);held.add(k);}
function release(k){held.delete(k);}
function audioInit(){try{ac??=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch{}}
function sound(name,pitch=1){
 if(muted||!ac)return;
 const presets={slash:[190+pitch*48,.10,'triangle'],dash:[105,.14,'sine'],jump:[320,.10,'sine'],pop:[510,.12,'sine'],hit:[125,.10,'triangle'],hurt:[78,.22,'sawtooth'],shard:[880,.3,'sine'],support:[523,.65,'sine'],checkpoint:[659,.4,'sine'],warn:[160,.2,'sine'],orb:[250,.16,'triangle'],wave:[205,.25,'sine'],boss:[93,.5,'triangle'],win:[740,.65,'sine']};
 const [f,d,type]=presets[name]||presets.hit,now=ac.currentTime;
 const o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,now);o.frequency.exponentialRampToValueAtTime(name==='shard'||name==='support'?f*1.65:Math.max(35,f*.45),now+d);
 v.gain.setValueAtTime(.0001,now);v.gain.exponentialRampToValueAtTime(name==='hurt'?.045:.055,now+.012);v.gain.exponentialRampToValueAtTime(.0001,now+d);
 o.connect(v);v.connect(ac.destination);o.start(now);o.stop(now+d+.02);
}
function burst(x,y,color,n=15,force=150){
 for(let i=0;i<n;i++)fx.push({kind:'spark',x,y,vx:rnd(-force,force),vy:rnd(-force,force),life:rnd(.2,.65),max:.65,color,size:rnd(2,5)});
}
function ring(x,y,color,r=80,life=.5){fx.push({kind:'ring',x,y,color,r,life,max:life});}
function banner(title,body,small=false){
 $('bannerTitle').textContent=title;$('bannerBody').textContent=body;$('banner').className='banner visible'+(small?' small':'');bannerUntil=clock+(small?2.3:3.3);
}
function processEvents(){
 for(const e of g.drain()){
  if(e.type==='sound')sound(e.name,e.pitch);
  if(e.type==='banner')banner(e.title,e.body,e.small);
  if(e.type==='text')texts.push({...e,life:.85,max:.85});
  if(e.type==='slash'){fx.push({kind:'slash',...e,life:.27,max:.27});}
  if(e.type==='hit'){burst(e.x,e.y,e.color,15);ring(e.x,e.y,e.color,40,.23);}
  if(e.type==='hurt'){burst(e.x,e.y,'#ffab8d',15);}
  if(e.type==='dash'){for(let i=0;i<3;i++)fx.push({kind:'ghost',x:e.x-e.facing*i*24,y:e.y,facing:e.facing,life:.25+i*.025,max:.35});}
  if(e.type==='support'){ring(e.x,e.y-50,'#b7ecd5',430,1);burst(e.x,e.y-70,'#c5f7d4',38,260);}
  if(e.type==='shard'){burst(e.x,e.y,'#f3d69c',25,210);ring(e.x,e.y,'#f3d69c',90);}
  if(e.type==='slam'){ring(e.x,e.y-8,'#cb99f1',200,.7);burst(e.x,e.y-10,'#b38ed3',32,250);sound('hit');}
  if(e.type==='enemyStrike'){ring(e.x,e.y,'#e5ac83',55,.24);}
  if(e.type==='bossDeath'){burst(e.x,e.y,'#e2bbff',85,390);ring(e.x,e.y,'#d3b0fa',420,1.5);}
  if(e.type==='dead')setTimeout(()=>{if(g.mode==='dead')showDead();},200);
  if(e.type==='won')showWon();
 }
}
function start(){audioInit();g.start();fx.length=0;texts.length=0;$('intro').classList.add('hidden');$('dialog').style.display='none';$('hud').style.display='flex';$('controls').style.display='flex';$('bossHud').style.display='none';held.clear();edge.clear();processEvents();}
function modal(title,body,buttons){
 $('dialogTitle').textContent=title;$('dialogBody').innerHTML=body;$('dialogActions').replaceChildren();
 for(const [label,action,primary] of buttons){const b=document.createElement('button');b.textContent=label;b.className=primary?'primary':'secondary';b.onclick=action;$('dialogActions').append(b);}
 $('dialog').style.display='grid';$('dialogActions').querySelector('button')?.focus();
}
function closeDialog(){$('dialog').style.display='none';if(g.mode==='paused')g.mode=dialogBack;last=performance.now();held.clear();edge.clear();}
function pause(){
 if(g.mode==='paused'){closeDialog();return;}if(g.mode!=='playing')return;
 dialogBack='playing';g.mode='paused';held.clear();edge.clear();
 modal('暂歇片刻','<p>剑光为你守住此刻。<br>准备好了，就继续向前。</p>',[['继续试炼',closeDialog,true],['重开本关',start,false]]);
}
function showHelp(){
 dialogBack=g.mode;if(g.mode==='playing')g.mode='paused';
 modal('执剑须知','<div class="help-grid"><div><b>A / D · 方向键</b>移动与转向</div><div><b>空格 / W</b>跳跃，拾取高台诺印</div><div><b>按住 J</b>三段连击，第三击更强</div><div><b>K / Shift</b>短暂无敌闪避</div><div><b>E · 徐昭支援</b>回血并攻击周围敌人</div><div><b>Esc</b>暂停 / 继续</div></div><p>收集三枚诺印，清除封印，击败混沌后走入右侧光门。触屏可用下方按钮。</p>',[['明白了',closeDialog,true]]);
}
function showDead(){modal('剑心未熄','<p>试炼尚未结束。<br>从最近的诺印锚点再次出发。</p>',[['锚点重生',()=>{$('dialog').style.display='none';g.respawn();fx.length=0;texts.length=0;held.clear();edge.clear();processEvents();},true],['重开本关',start,false]]);}
function showWon(){
 if(g.score>best){best=g.score;try{localStorage.setItem('songgang-trial-best-v1',String(best));}catch{}}
 const title=g.hits<=2?'信义无双':'破晓守诺';
 modal(title,'<p>混沌已散，剑诺长明。<br>吴地石桥的第一场试炼，完成。</p><div class="modal-stats"><div><b>'+g.score+'</b><span>本次得分</span></div><div><b>'+fmt(g.finishTime)+'</b><span>通关用时</span></div><div><b>'+best+'</b><span>本机最高</span></div></div>',[['再战一回',start,true]]);
}
document.addEventListener('keydown',e=>{
 if(e.code==='Escape'){e.preventDefault();if($('dialog').style.display==='grid')closeDialog();else pause();return;}
 if(e.code==='Enter'&&g.mode==='title'&&ready){start();return;}
 const k=keymap[e.code];if(k&&g.mode==='playing'){e.preventDefault();press(k);}
});
document.addEventListener('keyup',e=>{const k=keymap[e.code];if(k){release(k);if(g.mode==='playing')e.preventDefault();}});
window.addEventListener('blur',()=>{held.clear();edge.clear();if(g.mode==='playing')pause();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&g.mode==='playing')pause();});
for(const b of document.querySelectorAll('[data-control]')){
 b.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();b.setPointerCapture(e.pointerId);press(b.dataset.control);b.classList.add('held');});
 for(const evt of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(evt,()=>{release(b.dataset.control);b.classList.remove('held');});
}
$('startBtn').onclick=start;$('pauseBtn').onclick=pause;$('helpBtn').onclick=showHelp;$('introHelp').onclick=showHelp;
$('soundBtn').onclick=()=>{muted=!muted;audioInit();$('soundBtn').textContent=muted?'♩':'♪';$('soundBtn').setAttribute('aria-label',muted?'开启声音':'关闭声音');$('soundBtn').style.opacity=muted?.5:1;};
function img(name,x,y,w,h,alpha=1){const i=images[name];if(!i)return;ctx.save();ctx.globalAlpha=alpha;ctx.drawImage(i,x,y,w,h);ctx.restore();}
function actor(name,x,y,h,facing=1,angle=0,alpha=1,flash=false){
 const i=images[name];if(!i)return;let w=h*i.width/i.height;
 ctx.save();ctx.translate(x,y);ctx.scale(facing,1);ctx.rotate(angle);ctx.globalAlpha=alpha;
 if(flash)ctx.filter='brightness(1.65)';ctx.drawImage(i,-w/2,-h,w,h);ctx.restore();
}
function shadow(x,y,w=48,a=.3){ctx.save();ctx.fillStyle='rgba(0,0,0,'+a+')';ctx.beginPath();ctx.ellipse(x,y+2,w,w*.19,0,0,Math.PI*2);ctx.fill();ctx.restore();}
function diamond(x,y,r,color,glow=0){
 ctx.save();if(glow){ctx.shadowColor=color;ctx.shadowBlur=glow;}ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x,y-r);ctx.lineTo(x+r*.65,y);ctx.lineTo(x,y+r);ctx.lineTo(x-r*.65,y);ctx.closePath();ctx.fill();ctx.restore();
}
function label(text,x,y,color='#f3e7bd',size=15){ctx.save();ctx.font='600 '+size+'px "Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.fillStyle=color;ctx.shadowColor='#06131e';ctx.shadowBlur=5;ctx.fillText(text,x,y);ctx.restore();}
function drawBackground(cam){
 const b=images.background;if(b){let bw=H*b.width/b.height;ctx.drawImage(b,-cam*.105,0,bw,H);}
 else{ctx.fillStyle='#17303c';ctx.fillRect(0,0,W,H);}
 const wash=ctx.createLinearGradient(0,0,0,H);wash.addColorStop(0,'#07162250');wash.addColorStop(.5,'#193d4512');wash.addColorStop(1,'#08202bd9');ctx.fillStyle=wash;ctx.fillRect(0,0,W,H);
 // Slow drifting mist across the valley.
 for(let i=0;i<4;i++){let x=((i*420+clock*8-cam*.16)%(W+400)+W+400)%(W+400)-250;const fog=ctx.createRadialGradient(x,390+i*30,5,x,390+i*30,250);fog.addColorStop(0,'#beddd40b');fog.addColorStop(1,'#beddd400');ctx.fillStyle=fog;ctx.fillRect(x-250,250,500,300);}
 for(let i=0;i<33;i++){let x=(i*137.23+Math.sin(clock*.4+i)*24-cam*.25)%(W+120);if(x<0)x+=W+120;let y=130+((i*53)%430)+Math.sin(clock*.8+i)*18;ctx.fillStyle=i%5===0?'#f3c08099':'#b3f5ee55';ctx.beginPath();ctx.arc(x,y,i%4===0?2:1,0,7);ctx.fill();}
}
function platform(p){
 ctx.save();const x=p.x,y=p.y,w=p.w;
 ctx.fillStyle='#253e46';ctx.beginPath();ctx.moveTo(x-8,y+5);ctx.lineTo(x+12,y-6);ctx.lineTo(x+w-4,y-6);ctx.lineTo(x+w+9,y+4);ctx.lineTo(x+w,y+32);ctx.lineTo(x+5,y+36);ctx.closePath();ctx.fill();
 ctx.fillStyle='#57747b';ctx.fillRect(x,y-4,w,7);ctx.strokeStyle='#a3d2c066';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+9,y-4);ctx.lineTo(x+w-11,y-4);ctx.stroke();
 ctx.strokeStyle='#152d35';ctx.lineWidth=2;for(let i=30;i<w;i+=45){ctx.beginPath();ctx.moveTo(x+i,y+5);ctx.lineTo(x+i-7,y+26);ctx.stroke();}ctx.restore();
}
function gate(x,locked,kind=false){
 const h=212;img('gate',x-117,GROUND-h,234,h,locked?.78:.34);
 if(!locked)return;
 const cy=GROUND-104;ctx.save();ctx.translate(x,cy);ctx.rotate(clock*.35);ctx.strokeStyle=kind?'#b9d5ae':'#c4a1ec';ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=13;ctx.lineWidth=2;
 ctx.beginPath();ctx.arc(0,0,61,0,Math.PI*2);ctx.stroke();ctx.strokeRect(-43,-43,86,86);ctx.restore();
 diamond(x,cy,21,kind?'#d4e3a2':'#d4bcff',19);
}
function drawWorld(){
 ctx.save();ctx.translate(-g.camera,0);
 // The bridge above a band of dark, shimmering water.
 const water=ctx.createLinearGradient(0,GROUND+35,0,H);water.addColorStop(0,'#163c49');water.addColorStop(1,'#071c2a');ctx.fillStyle=water;ctx.fillRect(0,GROUND+45,WORLD,H-GROUND);
 for(let i=0;i<80;i++){let x=i*75+Math.sin(clock*.9+i)*12;ctx.fillStyle=i%3?'#79b6ba13':'#a0dce322';ctx.fillRect(x,650+(i*19)%65,23+(i*13)%48,1);}
 ctx.fillStyle='#263b42';ctx.fillRect(0,GROUND,WORLD,67);ctx.fillStyle='#4c6267';ctx.fillRect(0,GROUND-5,WORLD,10);
 ctx.strokeStyle='#9ebbb059';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,GROUND-5);ctx.lineTo(WORLD,GROUND-5);ctx.stroke();
 for(let i=0;i<WORLD;i+=80){ctx.strokeStyle='#172f3899';ctx.beginPath();ctx.moveTo(i+20,GROUND+12);ctx.lineTo(i+8,GROUND+54);ctx.stroke();ctx.fillStyle='#77929b15';ctx.fillRect(i+27,GROUND+18,38,4);}
 for(let x=100;x<WORLD;x+=620){ctx.fillStyle='#192e37';ctx.fillRect(x,GROUND+55,95,90);ctx.fillStyle='#324851';ctx.fillRect(x-7,GROUND+55,109,13);}
 for(const p of PLATFORMS)platform(p);
 for(const [x,h] of [[80,85],[625,62],[1320,65],[1680,80],[2460,72],[2860,110],[4140,73]])img('rocks',x-70,GROUND-h,128,h,.72);
 gate(1220,!g.waves[0].cleared);gate(2360,!g.waves[1].cleared);gate(3190,!g.bossStarted&&g.collected<3,true);
 if(g.bossStarted&&!g.bossDead){ctx.fillStyle='#b89cda25';ctx.fillRect(3230,GROUND-240,12,240);for(let i=0;i<8;i++)diamond(3236,GROUND-i*28-15,6,'#c9a4db',7);}
 // Three collectible oath seals.
 for(const s of g.shards){if(s.collected)continue;let y=s.y+Math.sin(clock*3+s.id)*7;ctx.save();ctx.translate(s.x,y);ctx.strokeStyle='#e8d28f60';ctx.rotate(clock*.6);ctx.strokeRect(-20,-20,40,40);ctx.restore();diamond(s.x,y,18,'#f3d599',22);diamond(s.x,y,8,'#fcf1c6');
  if(Math.abs(g.player.x-s.x)<310)label('诺印',s.x,y-36,'#ecd8a7',14);
 }
 // The exit only opens after the boss has fallen.
 const ex=4350;ctx.save();ctx.translate(ex,GROUND);ctx.fillStyle='#2b4548';ctx.fillRect(-72,-222,27,222);ctx.fillRect(45,-222,27,222);ctx.fillRect(-77,-227,154,22);
 if(g.bossDead){const gl=ctx.createLinearGradient(-50,0,50,0);gl.addColorStop(0,'#c6f3db0b');gl.addColorStop(.5,'#c6f3db70');gl.addColorStop(1,'#c6f3db0b');ctx.fillStyle=gl;ctx.fillRect(-50,-211,100,210);ctx.strokeStyle='#d2e8b8';ctx.lineWidth=2;ctx.strokeRect(-43,-207,86,203);label('信义之门',0,-250,'#d1e6b9',18);}else{ctx.strokeStyle='#8f779e55';ctx.strokeRect(-43,-207,86,203);}
 ctx.restore();
 for(const e of g.enemies){
  if(e.hp<=0&&e.dead<=0)continue;let opacity=e.hp>0?1:e.dead/.65;
  shadow(e.x,e.y,42,opacity*.32);let tilt=e.state==='windup'?Math.sin(clock*35)*.055:Math.sin(clock*9+e.phase)*.025;
  actor('beast',e.x,e.y+(e.hp>0?Math.sin(clock*8+e.phase)*2:10),100,e.x>g.player.x?-1:1,tilt,opacity,e.flash>0);
  if(e.hp>0){ctx.fillStyle='#090e14c0';ctx.fillRect(e.x-30,e.y-114,60,4);ctx.fillStyle='#b18ac9';ctx.fillRect(e.x-30,e.y-114,60*e.hp/e.maxHp,4);}
  if(e.state==='windup'&&e.hp>0){ringOnGround(e.x,65,'#efac78',.6);label('!',e.x,e.y-135,'#f5ba84',24);}
 }
 const b=g.boss;
 if(b){
  if(b.state==='slam'){const a=1-b.timer/(b.phase===2?.72:.95);ringOnGround(b.targetX,160,'#e4a08c',.2+a*.55);label('起跳 / 闪避',b.targetX,GROUND-38,'#ffca9e',15);}
  if(b.state==='orbs'){ringOnGround(b.x,125,'#c7a2eb',.4);label('紫核蓄力',b.x,GROUND-280,'#dbbdf4',17);}
  let opacity=b.hp>0?1:Math.min(.6,b.timer/1.6);
  if(opacity>0){shadow(b.x,GROUND,99,.45*opacity);actor('beast',b.x,GROUND,255,-1,b.state==='slam'?Math.sin(clock*21)*.015:Math.sin(clock*2)*.012,opacity,b.flash>0);}
 }
 for(const bullet of g.bullets){ctx.save();ctx.shadowColor='#c392f5';ctx.shadowBlur=18;const gr=ctx.createRadialGradient(bullet.x-3,bullet.y-4,0,bullet.x,bullet.y,bullet.r);gr.addColorStop(0,'#ffecff');gr.addColorStop(.35,'#d4a3ff');gr.addColorStop(1,'#7451ba');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(bullet.x,bullet.y,bullet.r,0,7);ctx.fill();ctx.restore();}
 const p=g.player;
 if(g.mode!=='dead'||Math.sin(clock*25)>0){
  shadow(p.x,GROUND,Math.max(18,43-(GROUND-p.y)*.1),.32);let run=Math.abs(p.vx)>40&&p.grounded;
  let lean=p.dash>0?.13:p.atk>0?-.12:run?Math.sin(clock*15)*.028:Math.sin(clock*2)*.007;
  let bob=p.grounded?(run?Math.sin(clock*18)*2:Math.sin(clock*2)*1.2):0;
  const alpha=p.inv>0&&Math.sin(clock*40)>0?.52:1;
  actor('hero',p.x,p.y+bob,147,p.facing,lean,alpha);
 }
 if(g.supportFx>0){let a=Math.min(1,g.supportFx*2);actor('xu',p.x-p.facing*110,p.y,145,p.facing,-.035,a*.92);label('星图指引',p.x-p.facing*110,p.y-165,'#c7eace',15);}
 drawEffects();ctx.restore();
}
function ringOnGround(x,r,color,a){ctx.save();ctx.strokeStyle=color;ctx.fillStyle=color;ctx.globalAlpha=a*.22;ctx.beginPath();ctx.ellipse(x,GROUND-2,r,r*.15,0,0,7);ctx.fill();ctx.globalAlpha=a;ctx.lineWidth=2;ctx.stroke();ctx.restore();}
function drawEffects(){
 for(const f of fx){
  const t=clamp(f.life/f.max,0,1);ctx.save();ctx.globalAlpha=t;
  if(f.kind==='spark'){ctx.fillStyle=f.color;ctx.shadowColor=f.color;ctx.shadowBlur=9;ctx.fillRect(f.x,f.y,f.size,f.size);}
  if(f.kind==='ring'){ctx.strokeStyle=f.color;ctx.lineWidth=3*t;ctx.shadowColor=f.color;ctx.shadowBlur=12;ctx.beginPath();ctx.ellipse(f.x,f.y,f.r*(1-t),f.r*(1-t)*.5,0,0,7);ctx.stroke();}
  if(f.kind==='ghost')actor('hero',f.x,f.y,147,f.facing,.05,t*.22);
  if(f.kind==='slash'){
   ctx.translate(f.x,f.y);ctx.scale(f.facing,1);const r=f.combo===3?112:85,progress=1-t;
   ctx.rotate(-.7+progress*1.5);ctx.lineCap='round';ctx.strokeStyle='#a9f2ed';ctx.shadowColor='#9af6ed';ctx.shadowBlur=20;ctx.lineWidth=12*t+3;
   ctx.beginPath();ctx.arc(-25,0,r,-1.2,1.1);ctx.stroke();ctx.strokeStyle='#fff0bd';ctx.lineWidth=3;ctx.beginPath();ctx.arc(-25,0,r+10,-1.05,.9);ctx.stroke();
  }
  ctx.restore();
 }
 for(const t of texts){ctx.save();ctx.globalAlpha=Math.min(1,t.life*3);label(t.text,t.x,t.y-(1-t.life/t.max)*40,t.color||'#fff0ca',24);ctx.restore();}
}
function drawTitleScene(){
 drawBackground(140);const floor=ctx.createLinearGradient(0,490,0,H);floor.addColorStop(0,'#15353d00');floor.addColorStop(1,'#0b222bf5');ctx.fillStyle=floor;ctx.fillRect(0,400,W,320);
 ctx.save();ctx.strokeStyle='#a6ccc948';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(902,612,270,44,0,0,7);ctx.stroke();ctx.strokeStyle='#c7b88733';ctx.beginPath();ctx.ellipse(902,612,239,34,0,0,7);ctx.stroke();ctx.restore();
 actor('beast',1090,470,175,-1,Math.sin(clock)*.015,.30);
 shadow(1000,597,69,.4);actor('xu',1014,601+Math.sin(clock*1.5)*3,232,-1,.015);
 shadow(790,622,89,.45);actor('hero',801,621+Math.sin(clock*1.7)*3,343,1,-.035);
 for(let i=0;i<7;i++)diamond(660+i*78,530+Math.sin(clock*.8+i)*60,2,'#d4e1ba',9);
}
function ui(){
 const p=g.player;$('hpNum').textContent=Math.ceil(p.hp)+' / 100';$('hpBar').style.width=p.hp+'%';
 $('hpBar').style.background=p.hp<30?'linear-gradient(90deg,#b6535c,#ee9c86)':'';
 $('dashCd').textContent=p.dashCd>0?p.dashCd.toFixed(1)+'s':'就绪';$('supportCd').textContent=p.supportCd>0?Math.ceil(p.supportCd)+'s':'就绪';
 $('objective').textContent=g.objective;
 document.querySelectorAll('.rune').forEach((e,i)=>e.classList.toggle('on',i<g.collected));
 $('bossHud').style.display=g.boss&&g.boss.hp>0?'block':'none';
 if(g.boss){$('bossBar').style.width=(g.boss.hp/g.boss.maxHp*100)+'%';$('bossStatus').textContent=g.boss.state==='slam'?'落地重击 · 跳起躲避':g.boss.state==='orbs'?'紫核弹幕 · 闪避穿越':g.boss.state==='recover'?'攻击空隙 · 就是现在':g.boss.phase===2?'紫核狂化 · 注意蓄力':'观察预兆，伺机进攻';}
 if(clock>bannerUntil)$('banner').classList.remove('visible');
 if(g.mode!=='title')$('saveHint').textContent='得分 '+g.score+' · '+fmt(g.time);
}
function frame(now){
 const dt=last?Math.min((now-last)/1000,.04):.016;last=now;clock+=dt;
 if(ready){
  const input={left:held.has('left'),right:held.has('right'),attack:held.has('attack'),jump:edge.has('jump'),dash:edge.has('dash'),support:edge.has('support')};edge.clear();
  g.step(dt,input);processEvents();
  if(g.mode!=='paused'){
   for(const f of fx){f.life-=dt;if(f.kind==='spark'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=260*dt;}}
   for(let i=fx.length-1;i>=0;i--)if(fx[i].life<=0)fx.splice(i,1);
   for(const t of texts)t.life-=dt;for(let i=texts.length-1;i>=0;i--)if(texts[i].life<=0)texts.splice(i,1);
  }
  ctx.save();if(g.shake>0&&g.mode==='playing')ctx.translate(Math.sin(clock*160)*g.shake,Math.cos(clock*143)*g.shake*.5);
  if(g.mode==='title'||(g.mode==='paused'&&dialogBack==='title'))drawTitleScene();else{drawBackground(g.camera);drawWorld();}
  ctx.restore();ui();
 }
 requestAnimationFrame(frame);
}
$('hud').style.display='none';$('controls').style.display='none';
Promise.all(Object.entries(ASSETS).map(([key,src])=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>{images[key]=i;resolve();};i.onerror=reject;i.src=src;}))).then(()=>{
 ready=true;$('portrait').src=ASSETS.hero;$('startBtn').disabled=false;$('startBtn').textContent='执剑出发';requestAnimationFrame(frame);
}).catch(()=>{$('startBtn').textContent='图像未能加载，请重新打开';});
})();
</script>
